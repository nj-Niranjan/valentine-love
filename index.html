<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Wife ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
}

.hidden{display:none;}

.card{
  background:white;
  margin:20px auto;
  padding:25px;
  border-radius:20px;
  max-width:420px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
  background:#d63384;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lock" class="card">
  <h2>🔐 Enter Our Secret</h2>
  <input type="password" id="pass" placeholder="Password">
  <br><br>
  <button onclick="unlock()">Open My Heart ❤️</button>
</div>

<!-- MAIN CONTENT -->
<div id="content" class="hidden">

  <audio id="music" src="music.mp3" loop></audio>

  <div class="card">
    <h1>💖 My Queen ❤️</h1>
    <h3>14-Day Valentine Surprise 💝</h3>
    <p id="surprise"></p>
  </div>

  <div class="card">
    <h2>💌 My Love Letter</h2>
    <p>
      My love,<br><br>
      You are my today, my tomorrow, and my forever.
      Every heartbeat of mine whispers your name.
      Thank you for choosing me, loving me, and standing with me.
      <br><br>
      Forever yours ❤️
    </p>
  </div>

  <div class="card">
    <h2>📸 Our Memories</h2>
    <img src="photos/photo1.jpg">
    <img src="photos/photo2.jpg">
    <img src="photos/photo3.jpg">
  </div>

</div>


<script>
// ================= PASSWORD =================
const PASSWORD = "nj&komal"; // change this

function unlock(){
  if(document.getElementById("pass").value === PASSWORD){
    document.getElementById("lock").style.display="none";
    document.getElementById("content").classList.remove("hidden");
    document.getElementById("music").play();
    showMessages();
  } else {
    alert("Wrong password 💔");
  }
}

// ================= DATE & TIME =================
const now = new Date();
const hour = now.getHours();
const month = now.getMonth() + 1;
const date = now.getDate();

// ================= HER BIRTHDAY =================
// CHANGE THIS 👇
const birthday = { month: 2, day: 24 }; 

// ================= NIGHT MESSAGE =================
const nightMessage = "🌙 Good night my love. Even the stars envy my love for you 💖";

// ================= DAILY MESSAGE =================
const dailyMessages = [
  "💖 You are my peace.",
  "🌸 Your smile heals me.",
  "💌 I am grateful for you.",
  "🌈 My happiness starts with you.",
  "🥰 I choose you every day."
];

// ================= VALENTINE WEEK 2026 =================
const valentineWeek = {
  "2-7": "🌹 Rose Day: Every rose reminds me of you.",
  "2-8": "💍 Propose Day: Will you be mine forever?",
  "2-9": "🍫 Chocolate Day: Life is sweeter with you.",
  "2-10": "🧸 Teddy Day: You are my comfort.",
  "2-11": "🤝 Promise Day: I promise to love you endlessly.",
  "2-12": "🤗 Hug Day: Sending you my warmest hug.",
  "2-13": "💋 Kiss Day: A kiss to seal my love.",
  "2-14": "❤️ Valentine’s Day: You are my forever."
};

function showMessages(){
  let msg = "";

  // 🎂 Birthday
  if(month === birthday.month && date === birthday.day){
    msg = "🎂 Happy Birthday My Love! You are my greatest blessing 💖";
  }
  // 🌹 Valentine Week
  else if(valentineWeek[`${month}-${date}`]){
    msg = valentineWeek[`${month}-${date}`];
  }
  // 🌙 Night Message
  else if(hour >= 23){
    msg = nightMessage;
  }
  // 💬 Message of the Day
  else {
    msg = dailyMessages[date % dailyMessages.length];
  }

  document.getElementById("surprise").innerText = msg;
}
</script>

</body>
</html>
