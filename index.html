<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Wife ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
}

.hidden{display:none;}

.card{
  background:white;
  margin:20px auto;
  padding:25px;
  border-radius:20px;
  max-width:420px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
  background:#d63384;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lock" class="card">
  <h2>🔐 Enter Our Secret</h2>
  <input type="password" id="pass" placeholder="Password">
  <br><br>
  <button onclick="unlock()">Open My Heart ❤️</button>
</div>

<!-- MAIN CONTENT -->
<div id="content" class="hidden">

  <audio id="music" src="music.mp3" loop></audio>

  <div class="card">
    <h1>💖 My Queen ❤️</h1>
    <h3>14-Day Valentine Surprise 💝</h3>
    <p id="surprise"></p>
  </div>

  <div class="card">
    <h2>💌 My Love Letter</h2>
    <p>
      My love,<br><br>
      You are my today, my tomorrow, and my forever.
      Every heartbeat of mine whispers your name.
      Thank you for choosing me, loving me, and standing with me.
      <br><br>
      Forever yours ❤️
    </p>
  </div>

  <div class="card">
    <h2>📸 Our Memories</h2>
    <img src="photos/photo1.jpg">
    <img src="photos/photo2.jpg">
    <img src="photos/photo3.jpg">
  </div>

</div>


<script>
// ================= PASSWORD =================
const PASSWORD = "nj&komal"; // keep or change

function unlock(){
  if(document.getElementById("pass").value === PASSWORD){
    document.getElementById("lock").style.display = "none";
    document.getElementById("content").classList.remove("hidden");
    document.getElementById("music").play();
    showMessage();
  } else {
    alert("Wrong password 💔");
  }
}

// ================= CURRENT DATE & TIME =================
const now = new Date();
const year = now.getFullYear();        // YYYY
const month = now.getMonth() + 1;      // 1–12
const day = now.getDate();             // 1–31
const hour = now.getHours();           // 0–23

// ================= HER BIRTHDAY =================
const birthday = { month: 2, day: 24 }; // Feb 24

// ================= NIGHT MESSAGE =================
const nightMessage =
"🌙 Good night my love. Even the stars envy my love for you 💖";

// ================= MESSAGE OF THE DAY =================
const dailyMessages = [
  "💖 You are my peace.",
  "🌸 Your smile heals me.",
  "💌 I am grateful for you.",
  "🌈 My happiness starts with you.",
  "🥰 I choose you every single day."
];

// ================= VALENTINE WEEK 2026 (FIXED) =================
const valentine2026 = {
  "2026-02-07": "🌹 Rose Day: Every rose reminds me of you.",
  "2026-02-08": "💍 Propose Day: Will you be mine forever?",
  "2026-02-09": "🍫 Chocolate Day: Life is sweeter with you.",
  "2026-02-10": "🧸 Teddy Day: You are my comfort.",
  "2026-02-11": "🤝 Promise Day: I promise to love you endlessly.",
  "2026-02-12": "🤗 Hug Day: Sending you my warmest hug.",
  "2026-02-13": "💋 Kiss Day: A kiss to seal my love.",
  "2026-02-14": "❤️ Valentine’s Day: You are my forever."
};

// ================= FINAL MESSAGE LOGIC =================
function showMessage(){

  const todayKey =
    year + "-" +
    String(month).padStart(2, "0") + "-" +
    String(day).padStart(2, "0");

  let message = "";

  // 🎂 Birthday (TOP PRIORITY)
  if (month === birthday.month && day === birthday.day) {
    message = "🎂 Happy Birthday My Love! You are my greatest blessing 💖";
  }
  // ❤️ Valentine Week (ONLY 2026)
  else if (valentine2026[todayKey]) {
    message = valentine2026[todayKey];
  }
  // 🌙 Night Message (after 9 PM)
  else if (hour >= 23) {
    message = nightMessage;
  }
  // 💬 Normal Daily Message
  else {
    message = dailyMessages[day % dailyMessages.length];
  }

  document.getElementById("surprise").innerText = message;
}
</script>


</body>
</html>
