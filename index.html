<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title><h1>My Queen ❤️</h1>
</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #d63384;
    }

    p {
      font-size: 18px;
      color: #444;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>My Love</h1>
    <h2>Today's Surprise 💝</h2>
    <p id="message"></p>
  </div>

  <script>
    const messages = [
      "🌹 You are the most beautiful part of my life.",
      "💌 I fall in love with you again every single day.",
      "🎁 Today’s gift: My heart, always yours.",
      "💖 I promise to stand by you forever.",
      "🌈 My favorite place is next to you.",
      "💍 I choose you. Today. Tomorrow. Always.",
      "🥰 Loving you is my greatest happiness."
    ];

    const today = new Date().getDate();
    const message = messages[today % messages.length];

    document.getElementById("message").innerText = message;
  </script>

</body>
</html>
